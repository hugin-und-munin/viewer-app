         behaves like the real thing. ── */
      details.module summary {
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      details.module summary::-webkit-details-marker {
        display: none;
      }
      details.module summary::before {
        content: '▸';
        color: #f09644;
        font-size: 11px;
        transition: transform 0.15s;
      }
      details.module[open] summary::before {
        transform: rotate(90deg);
      }
      details.module[open] summary {
        margin-bottom: 10px;
      }

        font-size: 12px;

          <button onclick="sendPause(1)">Pause 1 min</button>

          <button onclick="sendPause(30)">Pause 30 min</button>
        </div>
      </div>

  "command": "loadModule",

  "format": "HH:mm",
  "showSeconds": false,
  "showDate": true,
  "interval": 30
}</textarea

      async function send(msg) {
        try {
          const res = await fetch('http://localhost:3001', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(msg),
          })
          if (res.ok) {
            log(`Gesendet: ${JSON.stringify(msg)}`, 'ok')
          } else {
            log(`Serverfehler: ${res.status}`, 'err')
          }
        } catch (e) {
          log(
            `Verbindung zu http://localhost:3001 fehlgeschlagen — läuft die App? (${e.message})`,
            'err',
          )
        }
      }

      function sendPause(minutes) {
        send({ command: 'pause', duration: minutes })
      }

        Sammlung: 'Sammlung',
      }

      // ── Generic renderer ─────────────────────────────────────────────────

      function buildModuleSections() {
        const container = document.getElementById('module-sections')
        for (const name of Object.keys(MODULES)) {
          const module = MODULES[name]
          module.state = { ...module.defaults }

          const details = document.createElement('details')
          details.className = 'module'

          const summary = document.createElement('summary')
          summary.textContent = MODULE_LABELS[name] ?? name
          details.appendChild(summary)

          const card = document.createElement('div')
          card.className = 'msp-card'
          details.appendChild(card)

          const testRow = document.createElement('div')
          testRow.className = 'row'
          testRow.style.marginTop = '10px'
          const testBtn = document.createElement('button')
          testBtn.className = 'orange'
          testBtn.textContent = 'Testen'
          testBtn.onclick = () => testModule(name)
          testRow.appendChild(testBtn)
          details.appendChild(testRow)

          if (name === 'Weather') {
            details.appendChild(buildWeatherCycleRow(testWeatherCycle, 'Test-Zyklus Icons (jeder Klick = andere Tageszeit/Temperatur/Wetter)'))
            details.appendChild(buildWeatherCycleRow(testWeatherCyclePhoto, 'Test-Zyklus Fotos (jeder Klick = andere Tageszeit/Temperatur/Wetter)'))
          }

          const renderAll = () => {
            card.innerHTML = ''
            for (const field of module.fields) {
              if (field.type !== 'divider' && field.showWhen) {
                if (module.state[field.showWhen.field] !== field.showWhen.value) continue
              }
              card.appendChild(renderField(field, module.state, renderAll))
            }
          }
          module.renderAll = renderAll
          renderAll()

          container.appendChild(details)
        }
      }

      function buildWeatherCycleRow(handler, label) {
        const row = document.createElement('div')
        row.className = 'row'
        const btn = document.createElement('button')
        btn.className = 'orange'
        btn.textContent = label
        btn.onclick = handler
        row.appendChild(btn)
        return row
      }

      function renderField(field, state, rerender) {
        if (field.type === 'divider') {
          const div = document.createElement('div')
          div.className = 'setting-divider'
          return div
        }

        const row = document.createElement('div')
        row.className = 'setting-row' + (field.indent ? ' indented' : '')

        const label = document.createElement('span')
        label.className = 'setting-label'
        label.textContent = field.label
        row.appendChild(label)

        if (field.type === 'slider') {
          const wrap = document.createElement('div')
          wrap.className = 'setting-slider-wrap'
          const input = document.createElement('input')
          input.type = 'range'
          input.min = field.min
          input.max = field.max
          input.step = field.step ?? 1
          input.value = state[field.key]
          const valSpan = document.createElement('span')
          valSpan.className = 'setting-slider-val'
          const updateVal = () => {
            valSpan.textContent = `${input.value}${field.unit ?? ''}`
          }
          const updatePct = () => {
            const pct = ((input.value - field.min) / (field.max - field.min)) * 100
            input.style.setProperty('--pct', `${pct}%`)
          }
          updateVal()
          updatePct()
          input.addEventListener('input', () => {
            state[field.key] = Number(input.value)
            updateVal()
            updatePct()
          })
          wrap.appendChild(input)
          wrap.appendChild(valSpan)
          row.appendChild(wrap)
        } else if (field.type === 'toggle') {
          const btn = document.createElement('button')
          btn.type = 'button'
          btn.className = 'toggle' + (state[field.key] ? ' on' : '')
          btn.setAttribute('role', 'switch')
          btn.setAttribute('aria-checked', String(!!state[field.key]))
          const thumb = document.createElement('span')
          thumb.className = 'toggle-thumb'
          btn.appendChild(thumb)
          btn.addEventListener('click', () => {
            state[field.key] = !state[field.key]
            rerender()
          })
          row.appendChild(btn)
        } else if (field.type === 'radio') {
          const pills = document.createElement('div')
          pills.className = 'pills'
          for (const opt of field.options) {
            const pill = document.createElement('button')
            pill.type = 'button'
            pill.className = 'pill' + (state[field.key] === opt.value ? ' active' : '')
            pill.textContent = opt.label
            pill.addEventListener('click', () => {
              state[field.key] = opt.value
              rerender()
            })
            pills.appendChild(pill)
          }
          row.appendChild(pills)
        } else if (field.type === 'select') {
          const select = document.createElement('select')
          select.className = 'select-input'
          for (const opt of field.options) {
            const option = document.createElement('option')
            option.value = opt.value
            option.textContent = opt.label
            select.appendChild(option)
          }
          select.value = state[field.key]
          select.addEventListener('change', () => {
            state[field.key] = select.value
            rerender()
          })
          row.appendChild(select)
        } else if (field.type === 'select-dynamic') {
          // Real content-app fetches /modules/{id}/data and lists the distinct
          // collection names; kept simple here — just type the name.
          const input = document.createElement('input')
          input.type = 'text'
          input.className = 'select-input'
          input.placeholder = 'Sammlungsname eingeben…'
          input.value = state[field.key] ?? ''
          input.addEventListener('input', () => {
            state[field.key] = input.value
          })
          row.appendChild(input)
        }

        return row
      }

      function testModule(name) {
        const module = MODULES[name]
        const payload = { ...module.state }
        if (typeof payload.duration === 'number') {
          payload.duration = payload.duration * 60 * 1000 // minutes → ms (see comment above MODULES)
        }
        send({
          command: 'loadModule',
          type: name,
          module_id: module.id,
          ...payload,
        })
      }

      // ── Weather test-cycle (dev/QA only — not a real schema field) ────────
      // testCycle steps through a fixed list of synthetic time/temperature/
      // weather states (weatherTestScenarios.ts), a new one per module load —
      // click repeatedly to page through all of them. Both buttons share one
      // cursor (same underlying scenario list), so interleaving clicks
      // between the two just continues the sequence.

      function testWeatherCycle() {
        send({
          command: 'loadModule',
          type: 'Weather',
          module_id: WEATHER_ID,
          duration: 300000,
          audio: true,
          voice: 'female',
          pause: 'short',
          imageSource: 'icon',
          showTemperature: true,
          announceTomorrow: true,
          testCycle: true,
        })
      }

      function testWeatherCyclePhoto() {
        send({
          command: 'loadModule',
          type: 'Weather',
          module_id: WEATHER_ID,
          duration: 300000,
          audio: true,
          voice: 'female',
          pause: 'short',
          imageSource: 'photo',
          showTemperature: true,
          announceTomorrow: true,
          testCycle: true,
        })
      }

      // ── Custom ────────────────────────────────────────────────────────────

      function sendCustom() {
        try {
          const msg = JSON.parse(document.getElementById('json-input').value)
          send(msg)
        } catch (e) {
          log(`Invalid JSON: ${e.message}`, 'err')
        }
      }

      function log(text, type = '') {
        const el = document.getElementById('log')
        const entry = document.createElement('div')
        entry.className = `log-entry ${type}`
        entry.textContent = `${new Date().toLocaleTimeString()} — ${text}`
        el.prepend(entry)
      }

      buildModuleSections()
    </script>
  </body>
</html>
